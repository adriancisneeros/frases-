<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frases Studio</title>
<style>
:root{--bg:#0b0b0c;--card:#151517;--line:#2a2a2d;--gold:#d4af37;--txt:#f3efe6;--mut:#8d8a82}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:8px 0 2px;font-weight:600}
h1 span{color:var(--gold)}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
textarea{width:100%;min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);font-size:17px;padding:14px;resize:vertical;font-family:inherit}
textarea:focus{outline:1px solid var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
label.small{display:block;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:14px}
input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 14px;font-size:15px}
canvas{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);margin-top:16px;display:block}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
.gold{background:var(--gold);color:#111}
.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
#fav{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
#fav button{flex:none;max-width:200px;text-align:left;font-size:12px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:22px 0 8px}
</style>
</head>
<body>
<h1>Frases <span>Studio</span></h1>
<p class="sub">Escribe una vez. Elige tu universo.</p>

<textarea id="t" placeholder="Escribe tu frase…">Creando todo con intención. Incluso los días difíciles.</textarea>

<div class="row">
  <button class="chip" id="rnd">✨ Inspiración</button>
  <button class="chip" id="fv">♡ Guardar</button>
</div>

<label class="small">Estilo</label>
<div class="row" id="styles"></div>

<label class="small">Marco</label>
<div class="row">
  <button class="chip on" data-m="g">Genérico (tu firma)</button>
  <button class="chip" data-m="p">Personalizado (foto)</button>
</div>
<div id="photoBox" style="display:none">
  <input type="file" id="photo" accept="image/*" class="chip" style="width:100%">
</div>

<label class="small">Estilo Dola · ⚡ instantáneo en tu foto · ✦ con Gemini</label>
<div class="row" id="dola"></div>
<input type="text" id="persona" placeholder="Opcional: descríbete (ej. hombre, ojos verdes, gorra negra)">
<div class="row">
  <button class="btn gold" id="gem">Para estilos ✦: copiar prompt y abrir Gemini</button>
</div>
<p class="sub" id="gemhelp" style="margin:0">1) Sube tu foto abajo. 2) Toca un estilo ⚡ y cambia al instante. Los ✦ necesitan Gemini: botón 1, pega el prompt, y sube aquí el resultado.</p>
<label class="small">Sube tu foto o la imagen de Gemini</label>
<input type="file" id="photo2" accept="image/*" class="chip" style="width:100%">
<label class="small">Oscurecer fondo para leer la frase</label>
<input type="range" id="dark" min="0" max="80" value="35" style="width:100%">

<label class="small">Tu firma</label>
<input type="text" id="handle" value="@adriancisneeros__">

<canvas id="c" width="1080" height="1080"></canvas>

<div class="row">
  <button class="btn gold" id="dl">Descargar PNG</button>
  <button class="btn ghost" id="sh">Compartir</button>
</div>

<label class="small">Favoritas</label>
<div id="fav"></div>

<p class="foot">Hecho con intención · CAWI</p>

<script>
const $=id=>document.getElementById(id);
const c=$('c'),x=c.getContext('2d'),W=1080;
const FRASES=[
 "Creando todo con intención.\nIncluso los días difíciles.",
 "Lo que hoy pesa,\nmañana construye.",
 "Mantener una actitud positiva no significa que tengas que ser feliz todo el tiempo.",
 "Haz el bien\nsin mirar a quién.",
 "No tengo todo resuelto.\nTengo intención.",
 "Tu ejemplo es\nel mejor legado.",
 "Despacio también es avanzar.",
 "Lo que creas con intención\nte crea a ti."
];
const STYLES={
 gold:{n:"Gold Architect",bg:["#0a0a0a","#161208"],fg:"#f6efdc",ac:"#d4af37",frame:"gold",font:"Georgia,serif"},
 black:{n:"Minimal Black",bg:["#000","#000"],fg:"#ffffff",ac:"#888",frame:"none",font:"-apple-system,Helvetica,Arial,sans-serif"},
 beige:{n:"Beige Minimal",bg:["#efe6d6","#e6dac5"],fg:"#2b2418",ac:"#8a7552",frame:"thin",font:"Georgia,serif"},
 mid:{n:"Midnight Gradient",bg:["#0b1030","#3a1c5e"],fg:"#fff",ac:"#c9b8ff",frame:"none",font:"-apple-system,Helvetica,Arial,sans-serif"},
 blue:{n:"Blueprint Gold",bg:["#0a1a33","#0a1a33"],fg:"#fff",ac:"#d4af37",frame:"grid",font:"'Courier New',monospace"},
 kawaii:{n:"Kawaii",bg:["#0a0a0a","#0a0a0a"],fg:"#fff",ac:"#d4af37",frame:"kawaii",font:"-apple-system,Helvetica,Arial,sans-serif"}
};
let style='gold',mode='g',photoImg=null,photoFx=null;

function wrap(txt,maxW,size,font){
  x.font=`600 ${size}px ${font}`;
  const out=[];
  txt.split('\n').forEach(p=>{
    let line='';
    p.split(' ').forEach(w=>{
      const t=line?line+' '+w:w;
      if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t;
    });
    out.push(line);
  });
  return out;
}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function star(cx,cy,s,col){
  x.save();x.translate(cx,cy);x.fillStyle=col;x.beginPath();
  for(let i=0;i<8;i++){const r=i%2?s*.28:s;const a=i*Math.PI/4-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  x.closePath();x.fill();x.restore();
}
function draw(){
  const S=STYLES[style];
  x.clearRect(0,0,W,W);
  // fondo
  if(style==='kawaii'){x.fillStyle="#f6efe2";x.fillRect(0,0,W,W)}
  else{const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,S.bg[0]);g.addColorStop(1,S.bg[1]);x.fillStyle=g;x.fillRect(0,0,W,W)}
  // foto personalizada
  if(mode==='p'&&photoImg){
    const src=photoFx||photoImg;
    const r=Math.max(W/src.width,W/src.height);
    const w=src.width*r,h=src.height*r;
    x.drawImage(src,(W-w)/2,(W-h)/2,w,h);
    x.fillStyle="rgba(0,0,0,"+($('dark').value/100)+")";x.fillRect(0,0,W,W);
  }
  // marcos
  if(S.frame==='gold'){
    x.strokeStyle=S.ac;x.lineWidth=3;rr(70,70,W-140,W-140,28);x.stroke();
    x.lineWidth=1;x.globalAlpha=.5;rr(90,90,W-180,W-180,20);x.stroke();x.globalAlpha=1;
  }else if(S.frame==='thin'){
    x.strokeStyle=S.ac;x.lineWidth=2;x.strokeRect(70,70,W-140,W-140);
  }else if(S.frame==='grid'){
    x.strokeStyle="rgba(212,175,55,.15)";x.lineWidth=1;
    for(let i=0;i<=W;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,W);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
    x.strokeStyle=S.ac;x.lineWidth=3;x.strokeRect(80,80,W-160,W-160);
  }else if(S.frame==='kawaii'){
    x.fillStyle="#0a0a0a";rr(70,70,W-140,W-140,70);x.fill();
    x.strokeStyle=S.ac;x.lineWidth=5;rr(70,70,W-140,W-140,70);x.stroke();
    star(160,170,28,S.ac);star(W-170,190,20,S.ac);star(W-250,140,10,"#f6e7a8");star(210,W-170,14,"#f6e7a8");
  }
  // texto
  const raw=$('t').value.trim()||"Escribe tu frase…";
  let size=84,lines;
  const maxW=W-300;
  do{lines=wrap(raw,maxW,size,S.font);size-=4}while(lines.length*size*1.25>W-420&&size>36);
  size+=4;
  x.font=`600 ${size}px ${S.font}`;x.fillStyle=S.fg;x.textAlign="center";x.textBaseline="middle";
  const lh=size*1.25,top=W/2-(lines.length*lh)/2+lh/2-30;
  lines.forEach((l,i)=>x.fillText(l,W/2,top+i*lh));
  // firma pill
  const h=$('handle').value.trim();
  if(h){
    x.font=`500 30px ${S.font}`;
    const tw=x.measureText(h).width+70;
    x.fillStyle="rgba(0,0,0,.35)";
    if(style==='beige')x.fillStyle="rgba(255,255,255,.5)";
    rr(W/2-tw/2,W-210,tw,64,32);x.fill();
    x.strokeStyle=style==='black'?"#666":"#d4af37";x.lineWidth=2;rr(W/2-tw/2,W-210,tw,64,32);x.stroke();
    x.fillStyle=style==='beige'?"#6b5420":"#d4af37";
    x.fillText(h,W/2,W-177);
  }
}
// UI
const box=$('styles');
Object.entries(STYLES).forEach(([k,s])=>{
  const b=document.createElement('button');b.className='chip'+(k===style?' on':'');b.textContent=s.n;
  b.onclick=()=>{style=k;[...box.children].forEach(e=>e.classList.remove('on'));b.classList.add('on');draw()};
  box.appendChild(b);
});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(e=>e.classList.toggle('on',e===b));
  $('photoBox').style.display=mode==='p'?'block':'none';draw();
});
$('photo').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{photoImg=im;photoFx=null;applyDola?applyDola():draw()};im.src=URL.createObjectURL(f);
};
// ===== Efectos locales (instantáneos, gratis, sin IA) =====
function baseCanvas(){
  const cv=document.createElement('canvas');cv.width=cv.height=W;const g=cv.getContext('2d');
  const r=Math.max(W/photoImg.width,W/photoImg.height),w=photoImg.width*r,h=photoImg.height*r;
  g.drawImage(photoImg,(W-w)/2,(W-h)/2,w,h);return cv;
}
function soften(cv,f){
  const o=document.createElement('canvas');o.width=o.height=W;
  const s=document.createElement('canvas');s.width=s.height=Math.round(W/f);
  const a=s.getContext('2d');a.imageSmoothingQuality='high';a.drawImage(cv,0,0,s.width,s.height);
  const g=o.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(s,0,0,W,W);return o;
}
const cl=v=>v<0?0:v>255?255:v;
function pix(cv,fn){const g=cv.getContext('2d');const im=g.getImageData(0,0,W,W),d=im.data;fn(d);g.putImageData(im,0,0);return cv}
function gray(d,i){return .3*d[i]+.59*d[i+1]+.11*d[i+2]}
function sat(d,k){for(let i=0;i<d.length;i+=4){const y=gray(d,i);for(let c=0;c<3;c++)d[i+c]=cl(y+(d[i+c]-y)*k)}}
function con(d,k,b=0){for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)d[i+c]=cl((d[i+c]-128)*k+128+b)}
function post(d,n){for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)d[i+c]=Math.round(d[i+c]/255*(n-1))/(n-1)*255}
function edges(d,th){
  const g=new Float32Array(W*W);for(let i=0;i<W*W;i++)g[i]=gray(d,i*4);
  const e=new Uint8Array(W*W);
  for(let y=1;y<W-1;y++)for(let x2=1;x2<W-1;x2++){
    const k=y*W+x2;
    const gx=g[k-W+1]+2*g[k+1]+g[k+W+1]-g[k-W-1]-2*g[k-1]-g[k+W-1];
    const gy=g[k+W-1]+2*g[k+W]+g[k+W+1]-g[k-W-1]-2*g[k-W]-g[k-W+1];
    e[k]=Math.hypot(gx,gy)>th?1:0;
  }
  return e;
}
function ink(d,e,a=1){for(let k=0;k<W*W;k++)if(e[k]){const i=k*4;d[i]*=1-a;d[i+1]*=1-a;d[i+2]*=1-a}}
const FX={
 "Arte pop":()=>{let b=soften(baseCanvas(),2);return pix(b,d=>{con(d,1.3);sat(d,2.6);const e=edges(d,160);post(d,3);ink(d,e)})},
 "Vectores":()=>{let b=soften(baseCanvas(),4);return pix(b,d=>{sat(d,1.5);post(d,5);const e=edges(d,140);ink(d,e,.85)})},
 "Anime":()=>{let b=soften(baseCanvas(),3);return pix(b,d=>{sat(d,1.7);con(d,1.1,6);post(d,6);const e=edges(d,170);ink(d,e,.8)})},
 "Pintura al óleo":()=>{let b=soften(baseCanvas(),5);return pix(b,d=>{sat(d,1.35);con(d,1.12);post(d,9)})},
 "Impasto":()=>{let b=soften(baseCanvas(),4);return pix(b,d=>{sat(d,1.5);con(d,1.2);post(d,6);const e=edges(d,90);ink(d,e,.35)})},
 "Impresionismo":()=>{let b=soften(baseCanvas(),3);return pix(b,d=>{sat(d,1.45);for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*46;d[i]=cl(d[i]+n);d[i+1]=cl(d[i+1]+n);d[i+2]=cl(d[i+2]+n)}})},
 "Cyberpunk":()=>{let b=baseCanvas();return pix(b,d=>{con(d,1.25);for(let i=0;i<d.length;i+=4){const y=gray(d,i)/255;let r,g,bl;
    if(y<.5){const t=y/.5;r=20+235*t;g=0+0*t;bl=70+90*t}else{const t=(y-.5)/.5;r=255-255*t;g=0+240*t;bl=160+95*t}
    d[i]=r;d[i+1]=g;d[i+2]=bl}})},
 "Lápiz de color":()=>{const base=baseCanvas(),inv=soften(base,6);
    const a=base.getContext('2d').getImageData(0,0,W,W),bd=inv.getContext('2d').getImageData(0,0,W,W).data,d=a.data;
    for(let i=0;i<d.length;i+=4){const y=gray(d,i),b=255-gray(bd,i);const sk=cl(y*255/(255-b+1));
      for(let c=0;c<3;c++)d[i+c]=cl(.72*sk+.28*(d[i+c]*0.9+30))}
    base.getContext('2d').putImageData(a,0,0);
    return pix(base,dd=>{sat(dd,1.5);for(let i=0;i<dd.length;i+=4){dd[i]=cl(dd[i]*.98+6);dd[i+1]=cl(dd[i+1]*.97+6);dd[i+2]=cl(dd[i+2]*.92+6)}})},
 "Aguada de tinta":()=>{let b=soften(baseCanvas(),2);return pix(b,d=>{for(let i=0;i<d.length;i+=4){
    let y=gray(d,i)/255;y=Math.min(1,Math.max(0,(y-.22)/.6));y=y*y*(3-2*y);
    d[i]=cl(24+y*(243-24));d[i+1]=cl(22+y*(238-22));d[i+2]=cl(20+y*(226-20))}})},
 "Atardecer":()=>{let b=baseCanvas();return pix(b,d=>{sat(d,1.35);for(let k=0;k<W*W;k++){const i=k*4,t=1-(Math.floor(k/W)/W);
    d[i]=cl(d[i]*1.12+40*t);d[i+1]=cl(d[i+1]*.98+14*t);d[i+2]=cl(d[i+2]*.82)}})},
 "Nevado":()=>{let b=baseCanvas();return pix(b,d=>{sat(d,.55);for(let i=0;i<d.length;i+=4){d[i]=cl(d[i]*.95+22);d[i+1]=cl(d[i+1]*1.0+28);d[i+2]=cl(d[i+2]*1.08+40)}
    for(let n=0;n<2500;n++){const k=(Math.random()*W*W|0)*4,v=Math.random()>.5?255:235;d[k]=d[k+1]=d[k+2]=v}})}
};
// El resto (Arcilla, Flores, Rayo de sol, Bola de nieve, Junto al mar, Abstracto, Caricatura 3D, Piloto) requieren IA -> Gemini
const DOLA=["Arte pop","Vectores","Anime","Pintura al óleo","Impasto","Impresionismo","Cyberpunk","Lápiz de color","Aguada de tinta","Atardecer","Nevado","Arcilla","Flores","Rayo de sol","Bola de nieve","Junto al mar","Abstracto","Caricatura 3D","Piloto"];
let dola=null;
function applyDola(){
  photoFx=null;
  if(photoImg&&dola&&FX[dola]){
    $('gemhelp').textContent='Aplicando '+dola+'…';
    setTimeout(()=>{photoFx=FX[dola]();mode='p';
      document.querySelectorAll('[data-m]').forEach(el=>el.classList.toggle('on',el.dataset.m==='p'));
      $('photoBox').style.display='block';draw();$('gemhelp').textContent=dola+' aplicado a tu foto.'},30);
  }else if(dola&&!FX[dola]){
    $('gemhelp').textContent=dola+' necesita IA: toca el botón 1, pega el prompt en Gemini y sube aquí el resultado.';
  }else if(dola&&!photoImg){
    $('gemhelp').textContent='Sube tu foto abajo (paso 2) y se aplica '+dola+' al instante.';
  }
  draw();
}
DOLA.forEach(n=>{
  const b=document.createElement('button');b.className='chip';b.textContent=(FX[n]?'⚡ ':'✦ ')+n;
  b.onclick=()=>{dola=n;[...$('dola').children].forEach(e=>e.classList.toggle('on',e===b));applyDola()};
  $('dola').appendChild(b);
});
const orig=document.createElement('button');orig.className='chip';orig.textContent='Original';
orig.onclick=()=>{dola=null;photoFx=null;[...$('dola').children].forEach(e=>e.classList.remove('on'));draw();$('gemhelp').textContent='Foto original.'};
$('dola').appendChild(orig);
$('gem').onclick=async()=>{
  if(!dola){$('gemhelp').textContent='Primero elige un estilo Dola.';return}
  const frase=$('t').value.trim().replace(/\n/g,' ');
  const p=$('persona').value.trim();
  const prompt=`Crea una imagen cuadrada 1:1 en estilo ${dola}. Tema e inspiración: "${frase}". `+
   (p?`Incluye a la persona: ${p}, conservando su identidad. `:'')+
   `Sin texto, sin letras, sin marcas de agua. Deja el centro tranquilo y despejado para colocar una frase después.`;
  try{await navigator.clipboard.writeText(prompt);$('gemhelp').textContent='Prompt copiado. Pégalo en Gemini y sube aquí la imagen que te dé.'}
  catch(e){$('gemhelp').textContent=prompt}
  window.open('https://gemini.google.com/app','_blank');
};
$('photo2').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{
    photoImg=im;photoFx=null;mode='p';
    document.querySelectorAll('[data-m]').forEach(el=>el.classList.toggle('on',el.dataset.m==='p'));
    $('photoBox').style.display='block';applyDola();
    c.scrollIntoView({behavior:'smooth'});
  };im.src=URL.createObjectURL(f);
};
$('dark').oninput=draw;
$('t').oninput=draw;$('handle').oninput=draw;
$('rnd').onclick=()=>{$('t').value=FRASES[Math.floor(Math.random()*FRASES.length)];draw()};
function blob(){return new Promise(r=>c.toBlob(r,'image/png'))}
$('dl').onclick=async()=>{
  const b=await blob();const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='frase-'+Date.now()+'.png';a.click();
};
$('sh').onclick=async()=>{
  const b=await blob();const f=new File([b],'frase.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))try{await navigator.share({files:[f]})}catch(e){}
  else $('dl').click();
};
// favoritos
function favs(){try{return JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){return[]}}
function renderFav(){
  const box=$('fav');box.innerHTML='';
  favs().forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t.replace(/\n/g,' ').slice(0,40);
    b.onclick=()=>{$('t').value=t;draw()};box.appendChild(b)});
}
$('fv').onclick=()=>{
  const t=$('t').value.trim();if(!t)return;
  try{const f=favs().filter(v=>v!==t);f.unshift(t);localStorage.setItem('fav',JSON.stringify(f.slice(0,20)))}catch(e){}
  renderFav();
};
renderFav();draw();
</script>
</body>
</html>
